<svg width="700" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .value { font: 700 32px 'Segoe UI', sans-serif; fill: #ffffff; }
    .value-sm { font: 700 26px 'Segoe UI', sans-serif; fill: #ffffff; }
    .label { font: 400 14px 'Segoe UI', sans-serif; fill: #c9d1d9; }
    .label-bold { font: 700 14px 'Segoe UI', sans-serif; fill: #ffffff; }
    .range { font: 400 12px 'Segoe UI', sans-serif; fill: #56d364; }
  </style>

  <rect width="700" height="200" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- dividers -->
  <line x1="233.5" y1="30" x2="233.5" y2="170" stroke="#30363d" stroke-width="1"/>
  <line x1="466.5" y1="30" x2="466.5" y2="170" stroke="#30363d" stroke-width="1"/>

  <!-- Total Contributions -->
  <text x="117" y="72" text-anchor="middle" class="value">297</text>
  <text x="117" y="100" text-anchor="middle" class="label">Total Contributions</text>
  <text x="117" y="122" text-anchor="middle" class="range">Aug 17, 2025 - Present</text>

  <!-- Current Streak (circle + flame) -->
  <circle cx="350" cy="72" r="46" fill="none" stroke="#56d364" stroke-width="3"/>
  <path d="M350 20 c-2 6 -6 8 -6 13 c0 3 3 5 6 5 c3 0 6 -2 6 -5 c0 -5 -4 -7 -6 -13 z"
        fill="#58a6ff"/>
  <text x="350" y="82" text-anchor="middle" class="value-sm">8</text>
  <text x="350" y="138" text-anchor="middle" class="label-bold">Current Streak</text>
  <text x="350" y="158" text-anchor="middle" class="range">Aug 8 - Aug 15</text>

  <!-- Longest Streak -->
  <text x="583" y="72" text-anchor="middle" class="value">8</text>
  <text x="583" y="100" text-anchor="middle" class="label">Longest Streak</text>
  <text x="583" y="122" text-anchor="middle" class="range">Aug 8 - Aug 15</text>
</svg>